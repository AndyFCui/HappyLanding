global:
  fullnameOverride: km
  namespace: km-system

# Auth Service Configuration
auth-service:
  enabled: true
  replicaCount: 2

  image:
    repository: km-registry/auth-service
    tag: v1.0.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: auth.km.example.com
        paths: [/]
    tls:
      - secretName: auth-tls
        hosts: [auth.km.example.com]

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  env:
    - name: NODE_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Search Service Configuration
search-service:
  enabled: true
  replicaCount: 2

  image:
    repository: km-registry/search-service
    tag: v1.0.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Graph Service Configuration
graph-service:
  enabled: true
  replicaCount: 2

  image:
    repository: km-registry/graph-service
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

# Chat Service Configuration
chat-service:
  enabled: true
  replicaCount: 2

  image:
    repository: km-registry/chat-service
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65

# Document Service Configuration
document-service:
  enabled: true
  replicaCount: 2

  image:
    repository: km-registry/document-service
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: km.example.com
      paths:
        - path: /v1/auth
          service: auth-service
          port: 80
        - path: /v1/search
          service: search-service
          port: 80
        - path: /v1/graph
          service: graph-service
          port: 80
        - path: /v1/chat
          service: chat-service
          port: 80
        - path: /v1/documents
          service: document-service
          port: 80
  tls:
    - secretName: km-tls
      hosts: [km.example.com]

# PostgreSQL Configuration (for development/staging)
postgresql:
  enabled: false
  auth:
    database: kmdb
    username: kmadmin
  primary:
    persistence:
      size: 20Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1"

# Redis Configuration (for development/staging)
redis:
  enabled: false
  auth:
    enabled: true
  primary:
    persistence:
      size: 1Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"