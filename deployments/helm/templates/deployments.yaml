{{/* templates/deployments.yaml */}}
{{- $root := . -}}
{{- range $service := .Values.services }}
{{- if $service.enabled }}
{{- $serviceName := $service.name }}
{{- $image := printf "%s:%s" $service.image.repository ($service.image.tag | default $.Chart.AppVersion) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ include "km.namespace" $root }}
  labels:
    app: {{ $serviceName }}
    {{- include "km.labels" $root | nindent 4 }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app: {{ $serviceName }}
  template:
    metadata:
      labels:
        app: {{ $serviceName }}
        version: {{ $service.image.tag | default "v1" }}
    spec:
      serviceAccountName: {{ $service.serviceAccountName | default "km-service-account" }}
      containers:
        - name: {{ $serviceName }}
          image: {{ $image }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            {{- range $key, $value := $service.env }}
            - name: {{ $key }}
              {{- if kindIs "map" $value }}
              valueFrom: {{ $value | toJson }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
          resources:
            requests:
              memory: {{ $service.resources.requests.memory }}
              cpu: {{ $service.resources.requests.cpu }}
            limits:
              memory: {{ $service.resources.limits.memory }}
              cpu: {{ $service.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $serviceName }}
                topologyKey: topology.kubernetes.io/zone
{{- end }}
{{- end }}