apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: km-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
        version: v1
    spec:
      containers:
        - name: document-service
          image: km-registry/document-service:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: region
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: km-config
                  key: S3_BUCKET
            - name: STEP_FUNCTION_ARN
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: step-function-arn
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: document-service
                topologyKey: topology.kubernetes.io/zone