apiVersion: v1
kind: ConfigMap
metadata:
  name: km-config
  namespace: km-system
data:
  AWS_REGION: "ap-northeast-1"
  LOG_LEVEL: "info"
  REDIS_HOST: "km-redis.km-data.svc.cluster.local"
  REDIS_PORT: "6379"
  OPENSEARCH_ENDPOINT: "https://km-opensearch:443"
  NEPTUNE_ENDPOINT: "wss://km-neptune:8182/gremlin"
  S3_BUCKET: "km-documents"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: km-data
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: km-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: km-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi