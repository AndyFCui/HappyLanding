apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: km-ingress
  namespace: km-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Request-ID"
spec:
  tls:
    - hosts:
        - km.example.com
        - auth.km.example.com
        - search.km.example.com
        - chat.km.example.com
      secretName: km-tls
  rules:
    - host: km.example.com
      http:
        paths:
          - path: /v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /v1/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 80
          - path: /v1/graph
            pathType: Prefix
            backend:
              service:
                name: graph-service
                port:
                  number: 80
          - path: /v1/documents
            pathType: Prefix
            backend:
              service:
                name: document-service
                port:
                  number: 80
          - path: /v1/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 80
          - path: /v1/reports
            pathType: Prefix
            backend:
              service:
                name: report-service
                port:
                  number: 80
          - path: /v1/onboarding
            pathType: Prefix
            backend:
              service:
                name: onboarding-service
                port:
                  number: 80
          - path: /v1/datasources
            pathType: Prefix
            backend:
              service:
                name: datasource-service
                port:
                  number: 80