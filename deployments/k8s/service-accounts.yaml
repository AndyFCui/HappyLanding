apiVersion: v1
kind: ServiceAccount
metadata:
  name: km-service-account
  namespace: km-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/km-service-role
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: km-system
data:
  logstash.conf: |
    input {
      kubernetes {
        port => 5044
      }
    }
    filter {
      json {
        source => "message"
      }
      date {
        match => ["timestamp", "ISO8601"]
      }
    }
    output {
      elasticsearch {
        hosts => ["${ELASTICSEARCH_HOST}:9200"]
        index => "km-logs-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: km-data