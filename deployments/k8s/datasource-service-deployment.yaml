apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasource-service
  namespace: km-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datasource-service
  template:
    metadata:
      labels:
        app: datasource-service
        version: v1
    spec:
      containers:
        - name: datasource-service
          image: km-registry/datasource-service:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: region
            - name: EVENT_BUS_NAME
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: event-bus-name
            - name: CONNECTOR_LAMBDA_PREFIX
              value: "km-connector-"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: datasource-service
                topologyKey: topology.kubernetes.io/zone