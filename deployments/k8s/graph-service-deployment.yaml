apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-service
  namespace: km-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graph-service
  template:
    metadata:
      labels:
        app: graph-service
        version: v1
    spec:
      containers:
        - name: graph-service
          image: km-registry/graph-service:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEPTUNE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: neptune-endpoint
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: km-config
                  key: REDIS_HOST
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: graph-service
                topologyKey: topology.kubernetes.io/zone