# ============================================
# Prometheus Helm Values (kube-prometheus-stack)
# ============================================
# 用途：监控配置（Prometheus + Grafana + Alertmanager）
# 组件：
#   - prometheus-server: 指标采集与存储（15d retention，100GiB gp3）
#   - alertmanager: 告警路由（Email/Slack）
#   - grafana: 可视化仪表盘
#   - kube-state-metrics: K8s 对象状态
#   - node-exporter: 节点级指标
# ============================================

# Prometheus 配置
prometheus:
  prometheusSpec:
    # 数据保留期（15天）
    retention: 15d
    retentionSize: 50GiB
    # 副本标签（多副本时避免冲突）
    replicaExternalLabel: false
    prometheusExternalLabel: false

    # ServiceMonitor 自动发现
    serviceMonitorSelector:
      matchLabels:
        release: prometheus

    # PrometheusRule 自动发现
    ruleSelector:
      matchLabels:
        release: prometheus

    # Alertmanager 配置
    alerting:
      alertmanagers:
        - namespace: monitoring
          name: alertmanager-main
          port: web
          scheme: http

    # 持久化存储（gp3 SSD）
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 100Gi

    # 资源配置
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Alertmanager 配置
alertmanager:
  alertmanagerSpec:
    # 持久化存储
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 10Gi

  # 告警路由配置
  config:
    global:
      resolve_timeout: 5m
      # SMTP 配置（替换为你的邮箱服务）
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@happylanding.com'
      smtp_auth_username: 'alertmanager'
      smtp_auth_password: '<REPLACE_WITH_SECRET>'

    route:
      group_by: ['alertname', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'

    receivers:
      # 默认接收器（团队邮箱）
      - name: 'default'
        email_configs:
          - to: 'team@happylanding.com'
            send_resolved: true
      # Critical 告警（oncall + Slack）
      - name: 'critical-alerts'
        email_configs:
          - to: 'oncall@happylanding.com'
            send_resolved: true
        slack_configs:
          - api_url: '<REPLACE_WITH_SLACK_WEBHOOK>'
            channel: '#critical-alerts'
            send_resolved: true
      # Warning 告警（Slack）
      - name: 'warning-alerts'
        slack_configs:
          - api_url: '<REPLACE_WITH_SLACK_WEBHOOK>'
            channel: '#warnings'
            send_resolved: true

# Grafana 配置
grafana:
  # 管理员密码（生产环境用 Secret）
  adminPassword: 'prom-operator'

  # 数据源
  datasources:
    prometheus:
      type: prometheus
      access: proxy
      url: http://prometheus-server.monitoring.svc:9090
      isDefault: true

  # 仪表盘 providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          folder: ''
          type: file
          options:
            path: /var/lib/grafana/dashboards/default

  # 预置仪表盘（通过 Grafana.com ID 导入）
  dashboards:
    default:
      # Kubernetes Cluster Monitoring (ID: 7249)
      kubernetes-cluster:
        gnetId: 7249
        revision: 2
        datasource: Prometheus
      # Kubernetes Pods (ID: 737)
      kubernetes-pods:
        gnetId: 737
        revision: 2
        datasource: Prometheus
      # API Server Metrics (ID: 15760)
      api-server:
        gnetId: 15760
        revision: 2
        datasource: Prometheus

  # Service 类型
  service:
    type: ClusterIP

# kube-state-metrics 配置
kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[*]
    - deployments=[app]
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (pod|endpoint|namespace|service)

# node-exporter 配置
node-exporter:
  prometheus:
    monitor:
      enabled: true

# Alertmanager Ingress（可选，通过 Ingress 暴露）
alertmanager:
  ingress:
    enabled: false
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - alertmanager.happylanding.example.com
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.happylanding.example.com

# Grafana Ingress（可选）
grafana:
  ingress:
    enabled: false
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.happylanding.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.happylanding.example.com