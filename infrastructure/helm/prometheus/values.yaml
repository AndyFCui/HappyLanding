# Prometheus Community Helm Chart
# kube-prometheus-stack: Industry Standard for EKS Monitoring

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 50GiB
    replicaExternalLabel: false
    prometheusExternalLabel: false

    # Pod monitoring via ServiceMonitor
    serviceMonitorSelector:
      matchLabels:
        release: prometheus

    # Rule monitoring via PrometheusRule
    ruleSelector:
      matchLabels:
        release: prometheus

    # Enable alerting
    alerting:
      alertmanagers:
        - namespace: monitoring
          name: alertmanager-main
          port: web
          scheme: http

  # Persistent storage for Prometheus
  storageSpec:
    volumeClaimTemplate:
      spec:
        storageClassName: gp3
        resources:
          requests:
            storage: 100Gi

  # Resource limits
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

alertmanager:
  alertmanagerSpec:
    # Persistent storage for Alertmanager
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 10Gi

  # Alertmanager config
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@happylanding.com'
      smtp_auth_username: 'alertmanager'
      smtp_auth_password: '<REPLACE_WITH_SECRET>'

    route:
      group_by: ['alertname', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'

    receivers:
      - name: 'default'
        email_configs:
          - to: 'team@happylanding.com'
            send_resolved: true
      - name: 'critical-alerts'
        email_configs:
          - to: 'oncall@happylanding.com'
            send_resolved: true
        slack_configs:
          - api_url: '<REPLACE_WITH_SLACK_WEBHOOK>'
            channel: '#critical-alerts'
            send_resolved: true
      - name: 'warning-alerts'
        slack_configs:
          - api_url: '<REPLACE_WITH_SLACK_WEBHOOK>'
            channel: '#warnings'
            send_resolved: true

grafana:
  # Grafana admin password (use secret in production)
  adminPassword: 'prom-operator'

  # Additional data sources
  datasources:
    prometheus:
      type: prometheus
      access: proxy
      url: http://prometheus-server.monitoring.svc:9090
      isDefault: true

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          folder: ''
          type: file
          options:
            path: /var/lib/grafana/dashboards/default

  # Pre-configured dashboards
  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249
        revision: 2
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 737
        revision: 2
        datasource: Prometheus
      api-server:
        gnetId: 15760
        revision: 2
        datasource: Prometheus

  # Grafana service type
  service:
    type: ClusterIP

# kube-state-metrics configuration
kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[*]
    - deployments=[app]
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (pod|endpoint|namespace|service)

# node-exporter configuration
node-exporter:
  prometheus:
    monitor:
      enabled: true

# Alertmanager Ingress (optional)
alertmanager:
  ingress:
    enabled: false
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - alertmanager.happylanding.example.com
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.happylanding.example.com

# Grafana Ingress (optional)
grafana:
  ingress:
    enabled: false
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.happylanding.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.happylanding.example.com