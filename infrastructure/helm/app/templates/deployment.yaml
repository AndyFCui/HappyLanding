# ============================================
# Frontend + Backend Deployment
# ============================================
# 说明：两个 Deployment 共享同样的 Labels，便于统一管理
#       探针路径：Frontend / ; Backend /health
# ============================================

---
# Frontend Deployment (React)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "happylanding.fullname" . }}-frontend
  labels:
    {{- include "happylanding.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "happylanding.selectorLabels" . | nindent 6 }}
      app: frontend
  template:
    metadata:
      labels:
        {{- include "happylanding.selectorLabels" . | nindent 8 }}
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.frontend.port }}
              protocol: TCP
          # 健康检查
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          # 资源配置
          resources:
            {{- toYaml .Values.resources.frontend | nindent 10 }}
          # 环境变量
          env:
            {{- toYaml .Values.env.frontend | nindent 10 }}

---
# Backend Deployment (FastAPI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "happylanding.fullname" . }}-backend
  labels:
    {{- include "happylanding.labels" . | nindent 4 }}
    app: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "happylanding.selectorLabels" . | nindent 6 }}
      app: backend
  template:
    metadata:
      labels:
        {{- include "happylanding.selectorLabels" . | nindent 8 }}
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.image.backend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.backend.port }}
              protocol: TCP
          # 健康检查（/health 端点）
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          # 资源配置
          resources:
            {{- toYaml .Values.resources.backend | nindent 10 }}
          # 环境变量
          env:
            {{- toYaml .Values.env.backend | nindent 10 }}